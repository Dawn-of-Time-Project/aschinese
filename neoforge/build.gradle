plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client { client() }
        clientData { clientData() }
        serverData { serverData() }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    compileOnly project(":common")
    runtimeOnly("maven.modrinth:architectury-api:dZ7iNvS4")
    runtimeOnly("maven.modrinth:yacl:GL24RgOP")
    runtimeOnly("maven.modrinth:fusion-connected-textures:zPVqWQrW")
    runtimeOnly("maven.modrinth:armor-of-the-ages:szxHk9Wu")
    runtimeOnly("maven.modrinth:dawn-of-time:Kof3PABy")
    runtimeOnly("maven.modrinth:garden-trails:I3NLfe33")
}

publishMods {
    file = layout.buildDirectory.file("libs/${mod_id}-neoforge-${minecraft_version}-${project.version}.jar")
    modLoaders.add("neoforge")

    curseforge {
        //neoforge only dependencies found on curseforge go here. same format as in the root build.gradle
    }

    modrinth {
        //neoforge only dependencies found on modrinth go here. same format as in the root build.gradle
    }
}
