plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "QuiltMC"
        url = "https://maven.quiltmc.org/repository/release"
    }
    maven {
        url = "https://maven.isxander.dev/releases"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    runtimeOnly "maven.modrinth:dawn-of-time:GAfvth9d"
    runtimeOnly "maven.modrinth:yacl:s9SjoFu1"
    // YACL nested libraries are not loaded from Maven dependencies in dev
    runtimeOnly "org.quiltmc.parsers:json:0.2.1"
    runtimeOnly "org.quiltmc.parsers:gson:0.2.1"
    runtimeOnly "maven.modrinth:armor-of-the-ages:5sPEZaZo"
    implementation project(":common")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

publishMods {
    file = jar.archiveFile
    modLoaders.addAll("fabric")

    curseforge {
        //fabric only dependencies found on curseforge go here. same format as in the root build.gradle
    }

    modrinth {
        //fabric only dependencies found on modrinth go here. same format as in the root build.gradle
    }
}